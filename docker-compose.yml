version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./fashion.db
      - JWT_SECRET=change_this_in_production
      - AI_MODE=demo
      - CORS_ORIGINS=http://localhost:5173
      - UPLOAD_DIR=./uploads
    volumes:
      - ./backend:/app
    command: >
      sh -c "python ../scripts/seed_database.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

